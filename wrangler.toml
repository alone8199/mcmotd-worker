name = "mcmotd-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 静态资源：编译后的 Vue 前端（npm run build:front 生成到 front/dist）
# /api/* 始终先经过 Worker，其余路径由静态资源提供，未知路径回退到 index.html（适配 Vue Router）
[assets]
directory = "./front/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 非敏感配置。敏感信息请用 `wrangler secret put` 设置:
#   ADMIN_USERNAME
#   ADMIN_PASSWORD
[vars]
QUERY_TIMEOUT_MS = "3000"     # 单次 TCP 查询超时（毫秒）
JAVA_DEFAULT_PORT = "25565"
CACHE_ENABLED = "true"        # 是否启用 Cache API 缓存
CACHE_TTL_SECONDS = "60"      # 状态缓存时长
SRV_TTL_SECONDS = "600"       # SRV 记录缓存时长
